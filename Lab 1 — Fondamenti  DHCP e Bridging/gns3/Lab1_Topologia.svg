<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#1a1a2e">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap');
    </style>
    <!-- Router icon -->
    <symbol id="router" viewBox="0 0 60 60">
      <rect x="5" y="15" width="50" height="30" rx="4" fill="#0f3460" stroke="#16c79a" stroke-width="2"/>
      <circle cx="15" cy="30" r="3" fill="#16c79a"/>
      <circle cx="30" cy="30" r="3" fill="#16c79a"/>
      <circle cx="45" cy="30" r="3" fill="#e94560"/>
      <line x1="10" y1="22" x2="50" y2="22" stroke="#16c79a" stroke-width="0.5" opacity="0.5"/>
      <line x1="10" y1="38" x2="50" y2="38" stroke="#16c79a" stroke-width="0.5" opacity="0.5"/>
    </symbol>
    <!-- PC icon -->
    <symbol id="pc" viewBox="0 0 40 50">
      <rect x="5" y="5" width="30" height="22" rx="2" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
      <rect x="8" y="8" width="24" height="14" fill="#1a1a2e"/>
      <rect x="15" y="27" width="10" height="8" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
      <rect x="10" y="35" width="20" height="3" rx="1" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
    </symbol>
    <!-- Cloud icon -->
    <symbol id="cloud" viewBox="0 0 80 50">
      <ellipse cx="40" cy="30" rx="35" ry="18" fill="none" stroke="#f5a623" stroke-width="2"/>
      <ellipse cx="25" cy="25" rx="15" ry="12" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="55" cy="25" rx="15" ry="12" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
    </symbol>
    <!-- Gradient for zones -->
    <linearGradient id="hqZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16c79a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#16c79a" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="branchZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="wanZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.03"/>
    </linearGradient>
    <!-- VLAN colors -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#16c79a" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">MTCNA LAB 1 — TOPOLOGIA DI RETE</text>
  <text x="600" y="55" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="11">Fondamenti · DHCP · Bridging/VLAN</text>

  <!-- ==================== ZONE: HQ ==================== -->
  <rect x="30" y="80" width="520" height="620" rx="12" fill="url(#hqZone)" stroke="#16c79a" stroke-width="1" stroke-dasharray="6,3" opacity="0.8"/>
  <text x="50" y="105" fill="#16c79a" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">SEDE HQ</text>

  <!-- HQ Router -->
  <use href="#router" x="230" y="260" width="80" height="80"/>
  <text x="270" y="355" text-anchor="middle" fill="#16c79a" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">HQ-MAIN</text>
  <text x="270" y="372" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="9">CHR — 6 ether</text>

  <!-- VLAN 10 — MANAGEMENT (PC1) -->
  <rect x="50" y="130" width="180" height="120" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.7"/>
  <text x="60" y="150" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">VLAN 10 — MANAGEMENT</text>
  <text x="60" y="165" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.7">10.1.1.0/24</text>
  <use href="#pc" x="110" y="175" width="45" height="55"/>
  <text x="132" y="238" text-anchor="middle" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="10">PC1</text>
  <text x="132" y="250" text-anchor="middle" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">10.1.1.100 (statico)</text>

  <!-- VLAN 20 — VENDITE (PC2) -->
  <rect x="50" y="400" width="180" height="120" rx="8" fill="none" stroke="#45b7d1" stroke-width="1.5" opacity="0.7"/>
  <text x="60" y="420" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">VLAN 20 — VENDITE</text>
  <text x="60" y="435" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.7">10.1.2.0/24</text>
  <use href="#pc" x="110" y="445" width="45" height="55"/>
  <text x="132" y="508" text-anchor="middle" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="10">PC2</text>
  <text x="132" y="520" text-anchor="middle" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">DHCP .50–.200</text>

  <!-- VLAN 30 — PRODUZIONE (PC3) -->
  <rect x="50" y="555" width="180" height="120" rx="8" fill="none" stroke="#96ceb4" stroke-width="1.5" opacity="0.7"/>
  <text x="60" y="575" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">VLAN 30 — PRODUZIONE</text>
  <text x="60" y="590" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="9" opacity="0.7">10.1.3.0/24</text>
  <use href="#pc" x="110" y="600" width="45" height="55"/>
  <text x="132" y="663" text-anchor="middle" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="10">PC3</text>
  <text x="132" y="675" text-anchor="middle" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">DHCP .50–.200</text>

  <!-- Links PC → HQ -->
  <!-- PC1 (VLAN10) → HQ ether2 -->
  <line x1="155" y1="210" x2="240" y2="280" stroke="#4ecdc4" stroke-width="2" opacity="0.8"/>
  <text x="185" y="237" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="8" transform="rotate(-25, 185, 237)">ether2</text>

  <!-- PC2 (VLAN20) → HQ ether3 -->
  <line x1="155" y1="475" x2="240" y2="320" stroke="#45b7d1" stroke-width="2" opacity="0.8"/>
  <text x="180" y="410" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="8" transform="rotate(35, 180, 410)">ether3</text>

  <!-- PC3 (VLAN30) → HQ ether4 -->
  <line x1="155" y1="630" x2="245" y2="335" stroke="#96ceb4" stroke-width="2" opacity="0.8"/>
  <text x="175" y="520" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="8" transform="rotate(55, 175, 520)">ether4</text>

  <!-- Bridge label -->
  <rect x="215" y="380" width="110" height="30" rx="4" fill="#0f3460" stroke="#16c79a" stroke-width="1" opacity="0.8"/>
  <text x="270" y="400" text-anchor="middle" fill="#16c79a" font-family="JetBrains Mono, monospace" font-size="9">bridge-hq</text>
  <text x="270" y="425" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">VLAN filtering=yes</text>

  <!-- ==================== ZONE: WAN / EDGE ==================== -->
  <rect x="560" y="80" width="210" height="310" rx="12" fill="url(#wanZone)" stroke="#f5a623" stroke-width="1" stroke-dasharray="6,3" opacity="0.8"/>
  <text x="580" y="105" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">WAN / EDGE</text>

  <!-- EDGE Router -->
  <use href="#router" x="625" y="200" width="80" height="80"/>
  <text x="665" y="295" text-anchor="middle" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">EDGE-GW</text>
  <text x="665" y="312" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="9">CHR — 2 ether</text>

  <!-- Cloud NAT -->
  <use href="#cloud" x="625" y="100" width="80" height="55"/>
  <text x="665" y="165" text-anchor="middle" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="10">Cloud NAT</text>
  <text x="665" y="178" text-anchor="middle" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">INTERNET</text>

  <!-- Link EDGE → Cloud -->
  <line x1="665" y1="200" x2="665" y2="155" stroke="#f5a623" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="675" y="185" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="8">ether2</text>
  <text x="675" y="196" fill="#888" font-family="JetBrains Mono, monospace" font-size="7">DHCP client</text>

  <!-- Link HQ ↔ EDGE -->
  <line x1="310" y1="290" x2="625" y2="240" stroke="#f5a623" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="420" y="245" width="160" height="36" rx="4" fill="#1a1a2e" stroke="#f5a623" stroke-width="1" opacity="0.9"/>
  <text x="500" y="260" text-anchor="middle" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700">172.16.0.0/30</text>
  <text x="500" y="274" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="7">HQ:ether1 .2 ↔ EDGE:ether1 .1</text>

  <!-- ==================== ZONE: BRANCH ==================== -->
  <rect x="660" y="430" width="510" height="310" rx="12" fill="url(#branchZone)" stroke="#e94560" stroke-width="1" stroke-dasharray="6,3" opacity="0.8"/>
  <text x="680" y="455" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">SEDE BRANCH</text>

  <!-- BRANCH Router -->
  <use href="#router" x="730" y="510" width="80" height="80"/>
  <text x="770" y="605" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">BRANCH-01</text>
  <text x="770" y="622" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="9">CHR — 3 ether</text>

  <!-- Bridge branch label -->
  <rect x="715" y="635" width="110" height="25" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="1" opacity="0.8"/>
  <text x="770" y="652" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="9">bridge-branch</text>
  <text x="770" y="672" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">10.2.1.0/24 — flat</text>

  <!-- PC4 -->
  <use href="#pc" x="920" y="490" width="45" height="55"/>
  <text x="942" y="553" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="10">PC4</text>
  <text x="942" y="565" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">DHCP .10–.100</text>

  <!-- PC5 -->
  <use href="#pc" x="920" y="620" width="45" height="55"/>
  <text x="942" y="683" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="10">PC5</text>
  <text x="942" y="695" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">10.2.1.200 (statico)</text>

  <!-- Links BRANCH → PCs -->
  <line x1="810" y1="550" x2="920" y2="520" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <text x="870" y="528" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="8">ether2</text>

  <line x1="810" y1="570" x2="920" y2="650" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <text x="870" y="625" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="8">ether3</text>

  <!-- Link HQ ↔ BRANCH -->
  <line x1="300" y1="330" x2="740" y2="520" stroke="#e94560" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="440" y="400" width="165" height="36" rx="4" fill="#1a1a2e" stroke="#e94560" stroke-width="1" opacity="0.9"/>
  <text x="522" y="415" text-anchor="middle" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700">172.16.0.4/30</text>
  <text x="522" y="429" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="7">HQ:ether5 .5 ↔ BRANCH:ether1 .6</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="830" y="85" width="340" height="300" rx="8" fill="#0f3460" stroke="#888" stroke-width="1" opacity="0.9"/>
  <text x="850" y="110" fill="white" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">LEGENDA</text>
  
  <line x1="850" y1="130" x2="880" y2="130" stroke="#4ecdc4" stroke-width="2"/>
  <text x="890" y="134" fill="#4ecdc4" font-family="JetBrains Mono, monospace" font-size="9">VLAN 10 — Management</text>
  
  <line x1="850" y1="152" x2="880" y2="152" stroke="#45b7d1" stroke-width="2"/>
  <text x="890" y="156" fill="#45b7d1" font-family="JetBrains Mono, monospace" font-size="9">VLAN 20 — Vendite</text>
  
  <line x1="850" y1="174" x2="880" y2="174" stroke="#96ceb4" stroke-width="2"/>
  <text x="890" y="178" fill="#96ceb4" font-family="JetBrains Mono, monospace" font-size="9">VLAN 30 — Produzione</text>
  
  <line x1="850" y1="196" x2="880" y2="196" stroke="#f5a623" stroke-width="2"/>
  <text x="890" y="200" fill="#f5a623" font-family="JetBrains Mono, monospace" font-size="9">WAN / Interrouter HQ-EDGE</text>
  
  <line x1="850" y1="218" x2="880" y2="218" stroke="#e94560" stroke-width="2"/>
  <text x="890" y="222" fill="#e94560" font-family="JetBrains Mono, monospace" font-size="9">Branch / Interrouter HQ-BR</text>

  <text x="850" y="255" fill="white" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">INTERFACCE HQ</text>
  <text x="850" y="272" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ether1 → EDGE    172.16.0.2/30</text>
  <text x="850" y="286" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ether2 → PC1     VLAN 10 (pvid=10)</text>
  <text x="850" y="300" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ether3 → PC2     VLAN 20 (pvid=20)</text>
  <text x="850" y="314" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ether4 → PC3     VLAN 30 (pvid=30)</text>
  <text x="850" y="328" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ether5 → BRANCH  172.16.0.5/30</text>

  <text x="850" y="355" fill="white" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">DHCP SERVERS</text>
  <text x="850" y="372" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">HQ:   3 server (mgmt/vend/prod)</text>
  <text x="850" y="386" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">BRANCH: 1 server (branch-lan)</text>

  <!-- Footer -->
  <text x="600" y="785" text-anchor="middle" fill="#555" font-family="JetBrains Mono, monospace" font-size="9">MTCNA Lab 1 — Moduli 1, 2, 3 — GNS3 + MikroTik CHR v7</text>
</svg>
